[project]
name = "ch2-agent-monolith-trap"
version = "0.1.0"
description = "Companion code for Chapter 2 of The Write Path: three implementations of bank statement parsing, a self-correcting monolith, a deterministic Docling pipeline, and an ADK-orchestrated pipeline"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.15.0",
    "pandas>=2.2.0",
    "reportlab>=4.2.0",
    "opencv-python-headless>=4.11.0.86",
    "pypdf>=5.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "google-adk>=0.1.0",
]

[tool.uv]
package = false
override-dependencies = [
    "opencv-python; python_version < '0'",
]
